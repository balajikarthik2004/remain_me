<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Beru - Shadow Monarch's 3D Laptop Pet</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 60%, #150a25 0%, #080312 60%, #020106 100%);
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 100vw;
      height: 100vh;
      color: #fff;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      cursor: grab;
    }
    #canvas-container:active {
      cursor: grabbing;
    }
    
    /* Top Header Badge */
    .header-badge {
      position: absolute;
      top: 15px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(18, 10, 32, 0.75);
      border: 1px solid rgba(138, 75, 255, 0.4);
      border-radius: 20px;
      padding: 6px 14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(120, 50, 255, 0.2);
      z-index: 10;
    }
    .header-badge .rank {
      color: #00e5ff;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .header-badge .name {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    .header-badge .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00e5ff;
      box-shadow: 0 0 10px #00e5ff;
      animation: pulse-dot 1.5s infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.5; }
    }

    /* Speech Bubble */
    .speech-bubble {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      background: rgba(15, 8, 28, 0.92);
      border: 2px solid #8a4bff;
      box-shadow: 0 0 25px rgba(138, 75, 255, 0.6), inset 0 0 15px rgba(0, 229, 255, 0.2);
      border-radius: 16px;
      padding: 12px 22px;
      font-size: 14px;
      font-weight: 700;
      color: #e2f4ff;
      letter-spacing: 0.4px;
      text-align: center;
      max-width: 280px;
      pointer-events: none;
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 20;
    }
    .speech-bubble.active {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 10px 10px 0;
      border-style: solid;
      border-color: #8a4bff transparent transparent transparent;
    }

    /* Bottom Control Bar */
    .controls-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(14, 8, 26, 0.85);
      border: 1px solid rgba(138, 75, 255, 0.35);
      border-radius: 30px;
      padding: 6px 10px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(138, 75, 255, 0.2);
      z-index: 10;
    }
    .btn-action {
      background: rgba(30, 16, 56, 0.6);
      border: 1px solid rgba(138, 75, 255, 0.3);
      color: #bfa5ff;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      background: rgba(80, 35, 160, 0.8);
      color: #ffffff;
      border-color: #00e5ff;
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
      transform: translateY(-2px);
    }
    .btn-action.active {
      background: linear-gradient(135deg, #6c2bd9 0%, #3b82f6 100%);
      color: #ffffff;
      border-color: #00e5ff;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
    }

    /* Side Toggles */
    .side-toggles {
      position: absolute;
      top: 15px;
      right: 20px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .icon-btn {
      background: rgba(18, 10, 32, 0.75);
      border: 1px solid rgba(138, 75, 255, 0.4);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #00e5ff;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .icon-btn:hover {
      background: rgba(80, 35, 160, 0.8);
      transform: scale(1.1);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.5);
    }

    /* Hint text */
    .hint-bar {
      position: absolute;
      bottom: 68px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(190, 175, 225, 0.6);
      letter-spacing: 0.5px;
      pointer-events: none;
      z-index: 10;
    }
  </style>

  <!-- Three.js + GLTFLoader + OrbitControls via CDN with fallback -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>

  <div class="side-toggles">
    <div class="icon-btn" id="btn-sound" title="Sound Effects">🔊</div>

  <div class="speech-bubble" id="speech-bubble">

  <div class="hint-bar">

  <div class="controls-bar">

    <button class="btn-action" data-anim="Happy">💖 Happy</button>
    <button class="btn-action" data-anim="Sleep">💤 Sleep</button>
  </div>

  <div id="canvas-container"></div>

AAAAAAAAAAAAAAAAgD8AAAAAWaJdPgAAAACJ7nk/AAAAANTQMb4AAAAAXBx8PwAAAABZol0+AAAAAInueT8AAAAAAAAAAAAAAAAAAIA/AAAAAJqZmT6amRk/ZmZmP5qZmT8AAAAAAAAAAAAAAAAAAIA/AAAAAFmiXb4AAAAAie55PwAAAADU0DE+AAAAAFwcfD8AAAAAWaJdvgAAAACJ7nk/AAAAAAAAAAAAAAAAAACAPwAAAAAAAMA/AABAQAAAAAAAAAAAAACgPwAAAAAAAAAAXI+iPwAAAAAAAAAAAACgPwAAAAAAAMA/AABAQAAAgD8AAIA/AACAP7gehT8K14M/XI+CPwAAgD8AAIA/AACAPwAAAAAAAMA/AABAQG9jQz4AAAAAAAAAAOtLez/N5lQ+AAAAAAAAAADiZ3o/b2NDPgAAAAAAAAAA60t7PwAAAAAAAMA/AABAQGCr8DzXbQm+ynHIPeNUfD9gq/A8120JvspxyD3jVHw/YKvwPNdtCb7Kccg941R8PwAAAAAAAMA/AABAQGCr8DzXbQk+ynHIveNUfD9gq/A8120JPspxyL3jVHw/YKvwPNdtCT7Kcci941R8PwAAAAAAAMA/AABAQJthYD4n1pq9m/V6vXmIeD9ODGk+U7yZvfimfb27CHg/m2FgPifWmr2b9Xq9eYh4PwAAAAAAAMA/AABAQJthYD4n1po9m/V6PXmIeD9ODGk+U7yZPfimfT27CHg/m2FgPifWmj2b9Xo9eYh4PwAAAAAAAMA/AABAQDYwwz44nQi9aOikPficaz82MMM+OJ0IvWjopD34nGs/NjDDPjidCL1o6KQ9+JxrPwAAAAAAAMA/AABAQDYwwz44nQg9aOikvficaz82MMM+OJ0IPWjopL34nGs/NjDDPjidCD1o6KS9+JxrPw==";

    // Quotes for Beru
    const BERU_QUOTES = [
      "YOUR MAJESTY! ♡",
      "My King, you are the best!",
      "I shall tear apart anyone who dares disturb you, Sovereign!",
      "Everything I have belongs to you, My Liege! ✨",
      "Drink water, My Sovereign! Your health is paramount! 💧",
      "Glory to the Shadow Monarch!",
      "I will protect you with my very life, My King! ⚔️"
    ];

    let scene, camera, renderer, controls, mixer;
    let beruModel = null;
    let animationsMap = new Map();
    let currentAction = null;
    let particleSystem = null;
    let raycaster, mouse;
    let headNode = null;
    let speechTimeout = null;

    // Initialize Scene
    function init() {
      const container = document.getElementById('canvas-container');
      
      scene = new THREE.Scene();
      
      camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.8, 5.0);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 + 0.1;
      controls.minDistance = 1.5;
      controls.maxDistance = 10.0;
      controls.target.set(0, 1.2, 0);

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      setupLighting();
      setupShadowFloor();
      setupParticleAura();
      loadBeruModel();

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('click', onCanvasClick);
      window.addEventListener('mousemove', onMouseMove);
      
      setupUIControls();
    }

    function setupLighting() {
      // Ambient lighting
      const ambientLight = new THREE.AmbientLight(0x1a0f33, 2.5);
      scene.add(ambientLight);

      // Main directional light (Sunlight)
      const dirLight = new THREE.DirectionalLight(0xd1b3ff, 2.0);
      dirLight.position.set(3, 6, 4);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      scene.add(dirLight);

      // Cyan eye fill light
      const eyeFill = new THREE.PointLight(0x00e5ff, 2.5, 4.0);
      eyeFill.position.set(0, 2.2, 1.5);
      scene.add(eyeFill);

      // Monarch Purple Rim Light
      const rimLight = new THREE.DirectionalLight(0x8a2be2, 3.5);
      rimLight.position.set(-4, 3, -4);
      scene.add(rimLight);
    }

    function setupShadowFloor() {
      // Soft circular shadow disc under Beru
      const shadowGeo = new THREE.PlaneGeometry(3.5, 3.5);
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(128, 128, 10, 128, 128, 120);
      grad.addColorStop(0, 'rgba(80, 20, 180, 0.7)');
      grad.addColorStop(0.4, 'rgba(20, 5, 50, 0.5)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);

      const shadowTex = new THREE.CanvasTexture(canvas);
      const shadowMat = new THREE.MeshBasicMaterial({
        map: shadowTex,
        transparent: true,
        opacity: 0.8,
        depthWrite: false
      });
      const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
      shadowMesh.rotation.x = -Math.PI / 2;
      shadowMesh.position.y = 0.01;
      scene.add(shadowMesh);
    }

    function setupParticleAura() {
      const particleCount = 200;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);
      const velocities = [];

      for (let i = 0; i < particleCount; i++) {
        const r = 0.2 + Math.random() * 0.7;
        const theta = Math.random() * Math.PI * 2;
        positions[i * 3] = Math.cos(theta) * r;
        positions[i * 3 + 1] = Math.random() * 2.5;
        positions[i * 3 + 2] = Math.sin(theta) * r;

        velocities.push({
          vy: 0.01 + Math.random() * 0.02,
          vr: (Math.random() - 0.5) * 0.015,
          vTheta: (Math.random() - 0.5) * 0.04
        });

        // Violet or cyan embers
        if (Math.random() > 0.3) {
          colors[i * 3] = 0.55 + Math.random() * 0.2;   // R
          colors[i * 3 + 1] = 0.15;                     // G
          colors[i * 3 + 2] = 0.95;                     // B (Purple)
        } else {
          colors[i * 3] = 0.0;                          // R
          colors[i * 3 + 1] = 0.8 + Math.random() * 0.2;// G
          colors[i * 3 + 2] = 1.0;                      // B (Cyan)
        }
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      // Circular particle texture
      const pCanvas = document.createElement('canvas');
      pCanvas.width = 64;
      pCanvas.height = 64;
      const pCtx = pCanvas.getContext('2d');
      const pGrad = pCtx.createRadialGradient(32, 32, 2, 32, 32, 30);
      pGrad.addColorStop(0, 'rgba(255,255,255,1)');
      pGrad.addColorStop(0.3, 'rgba(200,100,255,0.8)');
      pGrad.addColorStop(1, 'rgba(0,0,0,0)');
      pCtx.fillStyle = pGrad;
      pCtx.fillRect(0, 0, 64, 64);
      const pTex = new THREE.CanvasTexture(pCanvas);

      const pMaterial = new THREE.PointsMaterial({
        size: 0.12,
        map: pTex,
        vertexColors: true,
        transparent: true,
        opacity: 0.75,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      particleSystem = new THREE.Points(geometry, pMaterial);
      particleSystem.userData.velocities = velocities;
      scene.add(particleSystem);
    }

    function updateParticles() {
      if (!particleSystem) return;
      const positions = particleSystem.geometry.attributes.position.array;
      const velocities = particleSystem.userData.velocities;
      const count = velocities.length;

      for (let i = 0; i < count; i++) {
        let x = positions[i * 3];
        let y = positions[i * 3 + 1];
        let z = positions[i * 3 + 2];
        const v = velocities[i];

        y += v.vy;
        let r = Math.sqrt(x*x + z*z);
        let theta = Math.atan2(z, x);
        theta += v.vTheta;
        r += v.vr;

        if (y > 2.8 || r > 1.2 || r < 0.1) {
          y = 0.1 + Math.random() * 0.3;
          r = 0.2 + Math.random() * 0.5;
          theta = Math.random() * Math.PI * 2;
        }

        positions[i * 3] = Math.cos(theta) * r;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = Math.sin(theta) * r;
      }
      particleSystem.geometry.attributes.position.needsUpdate = true;
    }

    // Convert Base64 to ArrayBuffer
    function base64ToArrayBuffer(base64) {
      const binary_string = window.atob(base64);
      const len = binary_string.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binary_string.charCodeAt(i);
      }
      return bytes.buffer;
    }

    function loadBeruModel() {
      const loader = new THREE.GLTFLoader();
      const arrayBuffer = base64ToArrayBuffer(GLB_BASE64);

      loader.parse(arrayBuffer, '', function(gltf) {
        beruModel = gltf.scene;

        // Tune materials for Solo Leveling Shadow look
        beruModel.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            
            const name = (child.name || '').toLowerCase();
            if (name.includes('wing') || name.includes('translucent')) {
              child.material = new THREE.MeshPhysicalMaterial({
                color: 0x2288ff,
                emissive: 0x0044aa,
                emissiveIntensity: 0.6,
                transparent: true,
                opacity: 0.72,
                roughness: 0.1,
                transmission: 0.6,
                thickness: 0.5
              });
            } else if (name.includes('eye')) {
              child.material = new THREE.MeshStandardMaterial({
                color: 0x00ffff,
                emissive: 0x00f0ff,
                emissiveIntensity: 2.2,
                roughness: 0.2
              });
            } else {
              // Sleek dark chitin armor
              child.material = new THREE.MeshStandardMaterial({
                color: 0x111116,
                roughness: 0.45,
                metalness: 0.55
              });
            }
          }

          if (child.name === 'head_group' || child.name === 'head') {
            headNode = child;
          }
        });

        scene.add(beruModel);

        // Setup Animations
        if (gltf.animations && gltf.animations.length) {
          mixer = new THREE.AnimationMixer(beruModel);
          gltf.animations.forEach((clip) => {
            const action = mixer.clipAction(clip);
            animationsMap.set(clip.name, action);
          });

          // Play Idle by default
          playAnimation('Idle');
        }

        showSpeech("YOUR MAJESTY! ♡");
      }, undefined, function(error) {
        console.error("Error loading GLB:", error);
      });
    }

    function playAnimation(name, crossFadeDuration = 0.3) {
      const nextAction = animationsMap.get(name);
      if (!nextAction) return;

      if (currentAction !== nextAction) {
        nextAction.reset();
        nextAction.play();
        if (currentAction) {
          currentAction.crossFadeTo(nextAction, crossFadeDuration, true);
        }
        currentAction = nextAction;
      }

      // Update button styles
      document.querySelectorAll('.btn-action').forEach(btn => {
        if (btn.getAttribute('data-anim') === name) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    function showSpeech(text) {
      const bubble = document.getElementById('speech-bubble');
      bubble.textContent = text;
      bubble.classList.add('active');

      if (speechTimeout) clearTimeout(speechTimeout);
      speechTimeout = setTimeout(() => {
        bubble.classList.remove('active');
      }, 3200);
    }

    function onCanvasClick(event) {
      // Ignore click if clicking UI buttons
      if (event.target.closest('.controls-bar') || event.target.closest('.side-toggles') || event.target.closest('.header-badge')) {
        return;
      }

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      if (beruModel) {
        const intersects = raycaster.intersectObjects(beruModel.children, true);
        if (intersects.length > 0) {
          // Clicked on Beru! Trigger Happy reaction
          playAnimation('Happy', 0.2);
          const randomQuote = BERU_QUOTES[Math.floor(Math.random() * BERU_QUOTES.length)];
          showSpeech(randomQuote);

          // Return to idle after happy animation finishes
          setTimeout(() => {
            const activeBtn = document.querySelector('.btn-action.active');
            const targetAnim = (activeBtn && activeBtn.getAttribute('data-anim') !== 'Happy') ? activeBtn.getAttribute('data-anim') : 'Idle';
            playAnimation(targetAnim, 0.4);
          }, 1400);
        }
      }
    }

    function onMouseMove(event) {
      const normX = (event.clientX / window.innerWidth) * 2 - 1;
      const normY = -(event.clientY / window.innerHeight) * 2 + 1;

      // Subtle head tracking towards mouse if headNode exists
      if (headNode && currentAction && currentAction.getClip().name === 'Idle') {
        headNode.rotation.y = THREE.MathUtils.lerp(headNode.rotation.y, normX * 0.25, 0.05);
        headNode.rotation.x = THREE.MathUtils.lerp(headNode.rotation.x, -normY * 0.15, 0.05);
      }
    }

    function setupUIControls() {
      document.querySelectorAll('.btn-action').forEach(btn => {
        btn.addEventListener('click', () => {
          const animName = btn.getAttribute('data-anim');
          playAnimation(animName);

          if (animName === 'Happy') {
            showSpeech("YOUR MAJESTY! ♡");
          } else if (animName === 'Sleep') {
            showSpeech("Rest peacefully, My King... 💤");
          } else if (animName === 'Fly') {
            showSpeech("I will scout from the skies, Sovereign! 🦅");
          } else if (animName === 'Walk') {
            showSpeech("Marching by your side, My Liege! 🐾");
          } else {
            showSpeech("Awaiting your command! ✨");
          }
        });
      });

      // Reset view button
      document.getElementById('btn-reset').addEventListener('click', () => {
        controls.reset();
        camera.position.set(0, 1.8, 5.0);
        controls.target.set(0, 1.2, 0);
      });

      // Theme toggle button
      let isDarkStudio = true;
      document.getElementById('btn-theme').addEventListener('click', () => {
        isDarkStudio = !isDarkStudio;
        if (isDarkStudio) {
          document.body.style.background = 'radial-gradient(circle at 50% 60%, #150a25 0%, #080312 60%, #020106 100%)';
        } else {
          // Transparent/minimalist mode for desktop overlay
          document.body.style.background = '#0a0a10';
        }
      });

      // Sound button
      let soundEnabled = true;
      const soundBtn = document.getElementById('btn-sound');
      soundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (mixer) mixer.update(delta);
      updateParticles();
      controls.update();

      renderer.render(scene, camera);
    }

    window.onload = () => {
      init();
      animate();
    };
  </script>
</body>
</html>
